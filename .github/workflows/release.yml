name: release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - {goos: linux,   goarch: amd64}
          - {goos: linux,   goarch: arm64}
          - {goos: darwin,  goarch: amd64}
          - {goos: darwin,  goarch: arm64}
          - {goos: windows, goarch: amd64}
          - {goos: windows, goarch: arm64}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.11'
      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
          VERSION: ${{ github.ref_name }}
        run: |
          EXT=""
          [ "$GOOS" = "windows" ] && EXT=".exe"
          go build -trimpath -ldflags "-s -w -X main.version=${VERSION} -X main.buildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" -o "skystacker_${GOOS}_${GOARCH}${EXT}" main.go
      - uses: actions/upload-artifact@v4
        with:
          name: skystacker-${{ matrix.goos }}-${{ matrix.goarch }}
          path: skystacker_*
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true
          body: |
            Static, dependency-free binaries (`CGO_ENABLED=0`) for Linux, macOS and Windows, amd64 and arm64.

            Pick the archive matching your OS and CPU. On Apple Silicon use `darwin_arm64`; on Intel Macs use `darwin_amd64`. Windows is `skystacker_windows_amd64.exe` (or `arm64` on ARM Windows).

            JPG, PNG, BMP and native FITS do not need extra tools. CR2/CR3 still need `dcraw` and ImageMagick on the machine that runs the command; those decoders are not bundled.

            Verify `SHA256SUMS.txt` before running. macOS Gatekeeper and Windows SmartScreen may warn on an unsigned download; the binary is a single static executable and does not install anything.
