name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build and self-test on all three OSes ─────────────────────────────
  build-and-test:
    name: ${{ matrix.os }} — build & self-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: macos-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false   # no dependencies => no go.sum; silences cache warning

      - name: Build
        shell: bash
        run: go build -o skystacker${{ matrix.ext }} .

      - name: Version
        shell: bash
        run: ./skystacker${{ matrix.ext }} --version

      - name: Self-test (embedded suite)
        shell: bash
        run: ./skystacker${{ matrix.ext }} --selftest

      - name: go vet
        shell: bash
        run: go vet ./...


  # ── goPureRaw nested module ─────────────────────────────────────────────
  pureraw:
    name: goPureRaw — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build goPureRaw
        working-directory: goPureRaw
        run: go build ./...
      - name: Test goPureRaw (CGO_ENABLED=0)
        working-directory: goPureRaw
        run: CGO_ENABLED=0 go test ./...
      - name: Race test goPureRaw
        working-directory: goPureRaw
        run: CGO_ENABLED=1 go test -race ./...

  # ── Standalone goDiagnostics module ─────────────────────────────────────
  diagnostics:
    name: goDiagnostics — build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Vet diagnostics
        working-directory: goDiagnostics
        run: go vet ./...
      - name: Test diagnostics
        working-directory: goDiagnostics
        run: CGO_ENABLED=0 go test ./...
      - name: Cross-build diagnostics
        working-directory: goDiagnostics
        run: |
          for target in linux/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%/*} GOARCH=${target#*/} CGO_ENABLED=0 go build ./... || exit 1
          done

  # ── gofmt check runs only on Linux (line endings are deterministic) ───
  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-compliant:"
            echo "$out"
            exit 1
          fi

  # ── Verify the module path works for `go install` ─────────────────────
  install:
    name: Verify go install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: go install .
        run: go install .
      - name: Run installed binary
        run: $(go env GOPATH)/bin/skystacker --version

  race:
    name: Self-test under -race
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Build with race detector
        run: go build -race -o skystacker-race .
      - name: Run self-tests under -race
        run: ./skystacker-race --selftest
