name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Build and self-test on all three OSes ─────────────────────────────
  build-and-test:
    name: ${{ matrix.os }} — build & self-test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ext: ""
          - os: macos-latest
            ext: ""
          - os: windows-latest
            ext: ".exe"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false   # no dependencies => no go.sum; silences cache warning

      - name: Build
        shell: bash
        run: go build -o skystacker${{ matrix.ext }} main.go

      - name: Version
        shell: bash
        run: ./skystacker${{ matrix.ext }} --version

      - name: Self-test (27 tests)
        shell: bash
        run: ./skystacker${{ matrix.ext }} --selftest

      - name: go vet
        shell: bash
        run: go vet ./...

  # ── gofmt check runs only on Linux (line endings are deterministic) ───
  gofmt:
    name: gofmt check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false
      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "Not gofmt-compliant:"
            echo "$out"
            exit 1
          fi

  # ── Verify the module path works for `go install` ─────────────────────
  install:
    name: Verify go install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.20'
          cache: false
      - name: go install .
        run: go install .
      - name: Run installed binary
        run: $(go env GOPATH)/bin/skystacker --version
